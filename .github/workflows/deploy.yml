name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character commit SHA to redeploy
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  MAX_PACKAGE_BYTES: 209715200

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      key: ${{ steps.pack.outputs.key }}
      site_url: ${{ steps.build.outputs.site_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Require commit on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$(git rev-parse HEAD) is not an ancestor of main; refusing to deploy" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50

      - name: Build
        id: build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          op run --no-masking --env-file=infra/build.env -- env -u OP_SERVICE_ACCOUNT_TOKEN bash -c '
            set -euo pipefail
            test -n "$DOMAIN_NAME"
            export NEXT_PUBLIC_SITE_URL="https://$DOMAIN_NAME"
            echo "site_url=$NEXT_PUBLIC_SITE_URL" >>"$GITHUB_OUTPUT"
            exec pnpm build'

      - name: Pack API
        id: pack
        run: |
          set -euo pipefail
          key="$(git rev-parse --short=12 HEAD)"

          node scripts/build-api-bundle.mjs

          test -f api-bundle/index.mjs
          test -f api-bundle/package.json
          test ! -e api-bundle/node_modules

          bytes=$(du -sb api-bundle | cut -f1)
          echo "api package: $(numfmt --to=iec "$bytes")"
          if [ "$bytes" -gt "$MAX_PACKAGE_BYTES" ]; then
            echo "::error::api package $(numfmt --to=iec "$bytes") exceeds the $(numfmt --to=iec "$MAX_PACKAGE_BYTES") guard; Lambda hard limit is 250MB unzipped"
            exit 1
          fi

          (cd api-bundle && zip -qry "../$key.zip" .)

          unzip -Z1 "$key.zip" | grep -qx 'index.mjs'

          echo "key=$key" >>"$GITHUB_OUTPUT"

      - name: Pack migrate
        run: |
          set -euo pipefail
          key="${{ steps.pack.outputs.key }}"
          rm -rf mig && mkdir -p mig

          node --input-type=commonjs -e '
            const fs = require("fs");
            const { dependencies } = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const pick = ["drizzle-orm", "pg"];
            for (const name of pick) {
              if (!dependencies[name]) throw new Error(name + " is not a dependency");
            }
            fs.writeFileSync("mig/package.json", JSON.stringify({
              name: "migrate",
              private: true,
              type: "module",
              dependencies: Object.fromEntries(pick.map((n) => [n, dependencies[n]])),
            }, null, 2) + "\n");
          '

          (cd mig && pnpm install --node-linker=hoisted --ignore-workspace --no-frozen-lockfile)

          cp -R drizzle mig/drizzle
          cp scripts/migrate-handler.mjs mig/migrate.mjs

          test -f mig/migrate.mjs
          test -f mig/drizzle/meta/_journal.json
          test ! -L mig/node_modules/drizzle-orm
          test ! -L mig/node_modules/pg

          bytes=$(du -sb mig | cut -f1)
          echo "migrate package: $(numfmt --to=iec "$bytes")"
          if [ "$bytes" -gt "$MAX_PACKAGE_BYTES" ]; then
            echo "::error::migrate package $(numfmt --to=iec "$bytes") exceeds the $(numfmt --to=iec "$MAX_PACKAGE_BYTES") guard"
            exit 1
          fi

          (cd mig && zip -qry "../$key-migrate.zip" .)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release
          path: |
            ${{ steps.pack.outputs.key }}.zip
            ${{ steps.pack.outputs.key }}-migrate.zip
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: site
          path: |
            out
            public/media
            public/video
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  terraform:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
    outputs:
      region: ${{ steps.out.outputs.region }}
      site_url: ${{ steps.out.outputs.site_url }}
      assets_bucket: ${{ steps.out.outputs.assets_bucket }}
      cloudfront_distribution_id: ${{ steps.out.outputs.cloudfront_distribution_id }}
      lambda_function_name: ${{ steps.out.outputs.lambda_function_name }}
      migrate_function_name: ${{ steps.out.outputs.migrate_function_name }}
      deploy_role_arn: ${{ steps.out.outputs.deploy_role_arn }}
      business_name: ${{ steps.out.outputs.business_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::150701180133:role/legacybenefitsgroup-github-terraform
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - run: terraform -chdir=infra init

      - name: Plan
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          grep '^TF_VAR_' infra/terraform.env >"$RUNNER_TEMP/tf.env"
          op run --no-masking --env-file="$RUNNER_TEMP/tf.env" -- env -u OP_SERVICE_ACCOUNT_TOKEN \
            terraform -chdir=infra plan -lock-timeout=10m -out="$RUNNER_TEMP/tfplan"

      - name: Plan summary
        run: |
          {
            echo '```'
            terraform -chdir=infra show -no-color "$RUNNER_TEMP/tfplan"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Guard
        run: |
          set -euo pipefail
          terraform -chdir=infra show -json "$RUNNER_TEMP/tfplan" | scripts/plan-guard.sh infra/destroy-allowlist.txt

      - name: Apply
        run: terraform -chdir=infra apply -lock-timeout=10m "$RUNNER_TEMP/tfplan"

      - name: Outputs
        id: out
        run: |
          set -euo pipefail
          terraform -chdir=infra output -json >"$RUNNER_TEMP/out.json"
          for k in region site_url assets_bucket cloudfront_distribution_id lambda_function_name migrate_function_name deploy_role_arn business_name; do
            v=$(jq -er --arg k "$k" '.[$k].value' "$RUNNER_TEMP/out.json")
            test -n "$v"
            echo "$k=$v" >>"$GITHUB_OUTPUT"
          done

  deploy:
    needs: [build, terraform]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ needs.terraform.outputs.assets_bucket }}
      KEY: ${{ needs.build.outputs.key }}
    steps:
      - name: Check site URL
        env:
          BUILT: ${{ needs.build.outputs.site_url }}
          APPLIED: ${{ needs.terraform.outputs.site_url }}
        run: test "$BUILT" = "$APPLIED"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ needs.terraform.outputs.deploy_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: site

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release

      - name: Upload release
        run: |
          set -euo pipefail
          aws s3 cp "$KEY.zip" "s3://$BUCKET/releases/$KEY.zip"
          aws s3 cp "$KEY-migrate.zip" "s3://$BUCKET/releases/$KEY-migrate.zip"

      - name: Migrate
        env:
          FN: ${{ needs.terraform.outputs.migrate_function_name }}
        run: |
          set -euo pipefail
          aws lambda update-function-code --function-name "$FN" \
            --s3-bucket "$BUCKET" --s3-key "releases/$KEY-migrate.zip" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FN"

          code=$(AWS_MAX_ATTEMPTS=1 aws lambda invoke --function-name "$FN" \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 330 \
            --query FunctionError --output text response.json)

          cat response.json

          if [ "$code" != "None" ] || grep -qiE '"(errorType|errorMessage)"' response.json; then
            echo "::error::migrations failed"
            exit 1
          fi

      - name: Update function
        env:
          FN: ${{ needs.terraform.outputs.lambda_function_name }}
        run: |
          set -euo pipefail
          aws lambda update-function-code --function-name "$FN" \
            --s3-bucket "$BUCKET" --s3-key "releases/$KEY.zip" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FN"

      - name: Sync static site
        run: |
          set -euo pipefail
          aws s3 sync out/_next/static "s3://$BUCKET/_next/static" --cache-control 'public,max-age=31536000,immutable'
          aws s3 sync out/ "s3://$BUCKET/" --delete --exclude 'releases/*' --exclude 'media/*' --exclude 'video/*' --exclude '_next/static/*' \
            --cache-control 'public,max-age=0,s-maxage=86400,must-revalidate'
          aws s3 sync public/media "s3://$BUCKET/media" --delete
          aws s3 sync public/video "s3://$BUCKET/video" --delete

      - name: Invalidate
        env:
          DIST: ${{ needs.terraform.outputs.cloudfront_distribution_id }}
        run: |
          aws cloudfront create-invalidation --distribution-id "$DIST" \
            --paths '/*' >/dev/null

      - name: Verify serving
        env:
          SITE: ${{ needs.terraform.outputs.site_url }}
          BUSINESS_NAME: ${{ needs.terraform.outputs.business_name }}
        run: |
          set -euo pipefail

          healthy=""
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/api/health" || echo 000)
            if [ "$code" = "200" ]; then healthy=1; break; fi
            echo "health attempt $i: $code"
            sleep 10
          done
          if [ -z "$healthy" ]; then
            echo "::error::$SITE/api/health never returned 200"
            exit 1
          fi

          code=$(curl -sS -o home.html -w '%{http_code}' --max-time 20 "$SITE/" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::$SITE/ returned $code"
            exit 1
          fi
          if ! grep -qF "$BUSINESS_NAME" home.html; then
            echo "::error::$SITE/ returned 200 but the body does not contain $BUSINESS_NAME"
            exit 1
          fi

          echo "serving: $SITE"

      - name: Verify signed POST
        env:
          SITE: ${{ needs.terraform.outputs.site_url }}
        run: |
          set -euo pipefail

          body='{}'
          hash=$(printf '%s' "$body" | sha256sum | cut -d' ' -f1)
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST \
            -H 'Content-Type: application/json' \
            -H "x-amz-content-sha256: $hash" \
            --data-binary "$body" "$SITE/api/do-not-contact" || echo 000)
          if [ "$code" != "400" ] && [ "$code" != "422" ]; then
            echo "::error::POST $SITE/api/do-not-contact returned $code, expected 400 or 422"
            exit 1
          fi
