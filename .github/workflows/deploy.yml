name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  deploy:
    name: Build, migrate, deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}

    steps:
      - uses: actions/checkout@v4

      # Short-lived credentials via OIDC. No AWS keys are stored in GitHub.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Tasks run on Graviton.
          platforms: linux/arm64
          push: true
          # Immutable tag: every deploy is traceable to a commit, and a rollback
          # is redeploying a known SHA rather than re-running a build.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Register the new revision BEFORE migrating, then migrate against that
      # revision, then roll the service onto it.
      #
      # The order is the whole point. Previously this ran migrations against the
      # service's CURRENT task definition with only `command` overridden, never
      # `image`, which broke in two directions:
      #
      #   - On a first deploy the current definition is still the Terraform
      #     bootstrap placeholder (nginx). nginx has no `node`, so the container
      #     never started, exitCode came back `None`, and the job failed here —
      #     before the deploy step. `terraform apply` plus a push to main could
      #     never produce a working site, and nothing said why.
      #   - On every later deploy it ran migrations from image N-1 and then
      #     started image N against them, so any release carrying a migration
      #     began on the pre-migration schema. That defeats the guarantee the
      #     Dockerfile is built around: migrations ship with the image so a
      #     release applies exactly the schema it was built against.
      - name: Register new task definition
        id: taskdef
        run: |
          set -euo pipefail

          CURRENT=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)

          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}"

          aws ecs describe-task-definition --task-definition "$CURRENT" \
            --query 'taskDefinition' --output json > taskdef.json

          jq --arg IMAGE "$IMAGE" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' taskdef.json > new-taskdef.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered $NEW_ARN"

      # Runs inside the VPC rather than from the runner, which would mean
      # exposing the database publicly.
      - name: Run database migrations
        run: |
          set -euo pipefail

          NETWORK=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK" \
            --overrides '{"containerOverrides":[{"name":"web","command":["node","node_modules/.bin/payload","migrate"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          # `None` means the container never started at all — a pull failure, a
          # bad command, an unreachable secret. Distinguished from a non-zero
          # exit because the causes and the fixes are completely different.
          if [ "$EXIT_CODE" = "None" ]; then
            echo "::error::Migration container never started. Stopped reason:"
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].[stoppedReason,containers[0].reason]' --output text
            exit 1
          fi

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration task exited with $EXIT_CODE — not deploying."
            exit 1
          fi

      - name: Deploy new image
        run: |
          set -euo pipefail

          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" >/dev/null

          echo "Waiting for the service to stabilise…"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Smoke test
        run: |
          set -euo pipefail
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.SITE_URL }}/api/health")
          echo "Health check: $STATUS"
          [ "$STATUS" = "200" ]
