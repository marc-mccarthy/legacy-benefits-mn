name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/plan-guard*"
      - ".trivyignore.yaml"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.1"

      - name: Format check
        run: terraform fmt -check -recursive infra

      - name: Plan guard test
        run: bash scripts/plan-guard.test.sh

      - name: Init and validate
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337

      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --chdir=infra --init
          tflint --chdir=infra

      - name: Scan infra for misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: infra
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
