# Toolchain pins for this repo. `mise install` provisions them.
#
# `infra/main.tf` declares `required_version = "~> 1.16"`, so anything older
# fails at `terraform init` with "Unsupported Terraform Core version" before it
# reaches the configuration.
[tools]
terraform = "1.16.1"
tflint = "0.64.0"
trivy = "0.74.0"
