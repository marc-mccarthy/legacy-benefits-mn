services:
  postgres:
    image: postgres:17-alpine
    container_name: legacy-benefits-mn
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legacybenefitsmn
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legacybenefitsmn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
