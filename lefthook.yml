pre-commit:
  piped: true
  jobs:
    - name: fix
      group:
        piped: true
        jobs:
          - name: docs-generate
            run: |
              set -eu
              dirty=$(git diff --name-only -- README.md CLAUDE.md AGENTS.md)
              rewritten=$(pnpm --silent docs:generate)
              [ -n "$rewritten" ] || exit 0
              if ! git diff --quiet -- package.json app.env; then
                echo "package.json or app.env has unstaged edits that the regenerated docs would describe. Stage or stash them." >&2
                exit 1
              fi
              for file in $rewritten; do
                if printf '%s\n' "$dirty" | grep -qxF "$file"; then
                  echo "$file has unstaged edits and a stale generated block. Stage or stash them." >&2
                  exit 1
                fi
              done
              printf '%s\n' "$rewritten" | xargs git add --
            fail_text: "Generated doc sections could not be refreshed and staged (see output above). Fix: stage or stash the unstaged file it names, or repair the marker error, then pnpm docs:generate. Bypass: git commit --no-verify"

          - name: diagrams-build
            glob:
              - "src/lib/**"
              - "src/api/**"
              - "docs/diagrams/*.mmd"
              - "docs/diagrams/SOURCES.md"
              - "docs/diagrams/diagrams.manifest.json"
              - "scripts/generate-diagrams.mjs"
              - "scripts/generate-derived-diagrams.mjs"
            exclude: "**/*.test.{ts,tsx}"
            run: |
              set -eu
              if ! git diff --quiet -- src/lib src/api 'docs/diagrams/*.mmd' ':(exclude)docs/diagrams/D5-module-map.mmd' ':(exclude,glob)**/*.test.ts' ':(exclude,glob)**/*.test.tsx'; then
                echo "Unstaged edits in diagram inputs (src/lib, src/api or a docs/diagrams .mmd). Stage or stash them." >&2
                exit 1
              fi
              pnpm --silent diagrams:build
              git add -- docs/diagrams/D5-module-map.mmd docs/diagrams/SOURCES.md docs/diagrams/diagrams.manifest.json
            fail_text: "Diagram atlas could not be rebuilt and staged (see output above). Fix: stage or stash the unstaged input it names; for a new or removed src/lib or src/api module, edit GROUPS in scripts/generate-derived-diagrams.mjs; then pnpm diagrams:build. Bypass: git commit --no-verify"

          - name: prettier
            glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,css,md,yml,yaml}"
            run: pnpm exec prettier --write {staged_files}
            stage_fixed: true

          - name: eslint
            glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
            run: pnpm exec eslint --fix {staged_files}
            stage_fixed: true

          - name: terraform-fmt
            glob: "*.tf"
            run: terraform fmt -recursive infra/

    - name: verify
      group:
        parallel: true
        jobs:
          - name: typecheck
            run: pnpm exec tsc --noEmit

          - name: unit-tests
            run: pnpm test:unit

          - name: prettier-check
            glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,css,md,yml,yaml}"
            run: pnpm exec prettier --check {staged_files}

          - name: drizzle
            run: pnpm exec drizzle-kit check

          - name: docs-check
            run: pnpm docs:check
            fail_text: "A doc reference or generated section is stale. Fix: pnpm docs:generate, then repair any reference listed above. Bypass: git commit --no-verify"

          - name: diagrams-check
            glob:
              - "src/lib/**"
              - "src/api/**"
              - "docs/diagrams/*.mmd"
              - "docs/diagrams/SOURCES.md"
              - "docs/diagrams/diagrams.manifest.json"
              - "scripts/generate-diagrams.mjs"
              - "scripts/generate-derived-diagrams.mjs"
            exclude: "**/*.test.{ts,tsx}"
            run: pnpm diagrams:check
            fail_text: "A diagram no longer matches its sources or the modules it maps. Fix: pnpm diagrams:build. Bypass: git commit --no-verify"

          - name: terraform-fmt-check
            glob: "*.tf"
            run: terraform fmt -check -recursive infra/

          - name: terraform-validate
            glob: "*.tf"
            run: terraform -chdir=infra validate

          - name: tflint
            glob: "*.tf"
            run: tflint --chdir=infra --init >/dev/null && tflint --chdir=infra

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm exec tsc --noEmit
    - name: unit-tests
      run: pnpm test:unit
    - name: prettier-check
      run: pnpm format:check
    - name: drizzle
      run: pnpm exec drizzle-kit check
    - name: docs-check
      run: pnpm docs:check
      fail_text: "A doc reference or generated section is stale. Fix: pnpm docs:generate, then repair any reference listed above. Bypass: git push --no-verify"
    - name: diagrams-check
      run: pnpm diagrams:check
      fail_text: "A diagram no longer matches its sources or the modules it maps. Fix: pnpm diagrams:build. Bypass: git push --no-verify"
    - name: terraform-fmt-check
      run: terraform fmt -check -recursive infra/
    - name: terraform-validate
      run: terraform -chdir=infra validate
    - name: tflint
      run: tflint --chdir=infra --init >/dev/null && tflint --chdir=infra

verify-all:
  parallel: true
  jobs:
    - name: eslint
      run: pnpm lint
    - name: typecheck
      run: pnpm exec tsc --noEmit
    - name: unit-tests
      run: pnpm test:unit
    - name: prettier-check
      run: pnpm format:check
    - name: drizzle
      run: pnpm exec drizzle-kit check
    - name: docs-check
      run: pnpm docs:check
      fail_text: "A doc reference or generated section is stale. Fix: pnpm docs:generate, then repair any reference listed above. Re-run: pnpm check"
    - name: diagrams-check
      run: pnpm diagrams:check
      fail_text: "A diagram no longer matches its sources or the modules it maps. Fix: pnpm diagrams:build. Re-run: pnpm check"
    - name: terraform-fmt-check
      run: terraform fmt -check -recursive infra/
    - name: terraform-validate
      run: terraform -chdir=infra validate
    - name: tflint
      run: tflint --chdir=infra --init >/dev/null && tflint --chdir=infra
