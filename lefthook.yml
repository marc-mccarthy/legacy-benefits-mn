#  pnpm check                  every gate, whole repo
#  lefthook run verify-all     the same thing
#  git commit --no-verify      bypass
#
# `fix` is piped because its jobs write to the same files; `verify` is parallel because
# its jobs only read. Terraform jobs carry a `*.tf` glob so a TypeScript commit skips them.

rc: .lefthookrc

pre-commit:
  piped: true
  jobs:
    - name: fix
      group:
        piped: true
        jobs:
          - name: prettier
            glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,css,md,yml,yaml}"
            run: pnpm exec prettier --write {staged_files}
            stage_fixed: true

          - name: eslint
            glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
            run: pnpm exec eslint --fix {staged_files}
            stage_fixed: true

          - name: terraform-fmt
            glob: "*.tf"
            run: terraform fmt -recursive infra/

          # Not glob-gated: the build is deterministic and idempotent, so a commit that
          # changes nothing it reads rewrites nothing and stages nothing.
          #
          # `stage_fixed` cannot carry the three files the generator writes. It re-adds
          # paths already in the staged set, and SOURCES.md, the manifest and a derived
          # D5 are usually not in it — measured: with `stage_fixed`, editing a .mmd
          # committed the source without its regenerated SOURCES.md, and the resulting
          # commit failed `diagrams:check`. Naming them in `git add` is what fixes that.
          - name: diagrams
            run: >-
              pnpm diagrams:build &&
              git add docs/diagrams/SOURCES.md
              docs/diagrams/diagrams.manifest.json
              docs/diagrams/D5-module-map.mmd

    - name: verify
      group:
        parallel: true
        jobs:
          - name: typecheck
            run: pnpm exec tsc --noEmit

          - name: unit-tests
            run: pnpm test:unit

          - name: prettier-check
            glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,css,md,yml,yaml}"
            run: pnpm exec prettier --check {staged_files}

          - name: diagrams-check
            run: pnpm diagrams:check

          - name: drizzle
            run: pnpm exec drizzle-kit check

          - name: doc-references
            run: pnpm docs:check

          - name: terraform-fmt-check
            glob: "*.tf"
            run: terraform fmt -check -recursive infra/

          - name: terraform-validate
            glob: "*.tf"
            run: terraform -chdir=infra validate

          - name: tflint
            glob: "*.tf"
            run: tflint --chdir=infra --init >/dev/null && tflint --chdir=infra

          # Off by decision, 2026-09-23: `trivy config infra/` reports 19 pre-existing
          # findings, and those fixes are not wanted yet. `ci.yml` still scans every PR.
          # Uncommenting these four lines is the whole re-enable.
          #
          # - name: trivy
          #   glob: "*.tf"
          #   run: trivy config infra/ --exit-code 1

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm exec tsc --noEmit
    - name: unit-tests
      run: pnpm test:unit
    - name: prettier-check
      run: pnpm format:check
    - name: diagrams-check
      run: pnpm diagrams:check
    - name: drizzle
      run: pnpm exec drizzle-kit check
    - name: doc-references
      run: pnpm docs:check
    - name: terraform-fmt-check
      run: terraform fmt -check -recursive infra/
    - name: terraform-validate
      run: terraform -chdir=infra validate
    - name: tflint
      run: tflint --chdir=infra --init >/dev/null && tflint --chdir=infra

verify-all:
  parallel: true
  jobs:
    - name: eslint
      run: pnpm lint
    - name: typecheck
      run: pnpm exec tsc --noEmit
    - name: unit-tests
      run: pnpm test:unit
    - name: prettier-check
      run: pnpm format:check
    - name: diagrams-check
      run: pnpm diagrams:check
    - name: drizzle
      run: pnpm exec drizzle-kit check
    - name: doc-references
      run: pnpm docs:check
    - name: terraform-fmt-check
      run: terraform fmt -check -recursive infra/
    - name: terraform-validate
      run: terraform -chdir=infra validate
    - name: tflint
      run: tflint --chdir=infra --init >/dev/null && tflint --chdir=infra
