rc: .lefthookrc

pre-commit:
  piped: true
  jobs:
    - name: fix
      group:
        piped: true
        jobs:
          - name: prettier
            glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,css,md,yml,yaml}"
            run: pnpm exec prettier --write {staged_files}
            stage_fixed: true

          - name: eslint
            glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
            run: pnpm exec eslint --fix {staged_files}
            stage_fixed: true

          - name: terraform-fmt
            glob: "*.tf"
            run: terraform fmt -recursive infra/

          - name: diagrams
            run: >-
              pnpm diagrams:build &&
              git add docs/diagrams/SOURCES.md
              docs/diagrams/diagrams.manifest.json
              docs/diagrams/D5-module-map.mmd

    - name: verify
      group:
        parallel: true
        jobs:
          - name: typecheck
            run: pnpm exec tsc --noEmit

          - name: unit-tests
            run: pnpm test:unit

          - name: prettier-check
            glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,css,md,yml,yaml}"
            run: pnpm exec prettier --check {staged_files}

          - name: diagrams-check
            run: pnpm diagrams:check

          - name: drizzle
            run: pnpm exec drizzle-kit check

          - name: terraform-fmt-check
            glob: "*.tf"
            run: terraform fmt -check -recursive infra/

          - name: terraform-validate
            glob: "*.tf"
            run: terraform -chdir=infra validate

          - name: tflint
            glob: "*.tf"
            run: tflint --chdir=infra --init >/dev/null && tflint --chdir=infra

          # - name: trivy
          #   glob: "*.tf"
          #   run: trivy config infra/ --exit-code 1

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm exec tsc --noEmit
    - name: unit-tests
      run: pnpm test:unit
    - name: prettier-check
      run: pnpm format:check
    - name: diagrams-check
      run: pnpm diagrams:check
    - name: drizzle
      run: pnpm exec drizzle-kit check
    - name: terraform-fmt-check
      run: terraform fmt -check -recursive infra/
    - name: terraform-validate
      run: terraform -chdir=infra validate
    - name: tflint
      run: tflint --chdir=infra --init >/dev/null && tflint --chdir=infra

verify-all:
  parallel: true
  jobs:
    - name: eslint
      run: pnpm lint
    - name: typecheck
      run: pnpm exec tsc --noEmit
    - name: unit-tests
      run: pnpm test:unit
    - name: prettier-check
      run: pnpm format:check
    - name: diagrams-check
      run: pnpm diagrams:check
    - name: drizzle
      run: pnpm exec drizzle-kit check
    - name: terraform-fmt-check
      run: terraform fmt -check -recursive infra/
    - name: terraform-validate
      run: terraform -chdir=infra validate
    - name: tflint
      run: tflint --chdir=infra --init >/dev/null && tflint --chdir=infra
